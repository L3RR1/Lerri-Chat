[package]
name = "lerrichat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
lerri-client = { version = "0.0.4", path = "../crates/client" }
lerri-core = { version = "0.0.4", path = "../crates/core" }
lerri-crypto = { version = "0.0.4", path = "../crates/crypto" }
lerri-host = { version = "0.0.4", path = "../crates/host" }
lerri-net = { version = "0.0.4", path = "../crates/net" }
lerri-ui = { version = "0.0.4", path = "../crates/ui" }
qrcode = { version = "0.14.1", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
