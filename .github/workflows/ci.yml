name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # RNF-02: binário < 25 MB.
  MAX_EXE_BYTES: 26214400

jobs:
  # DLLs do FFmpeg que vão no pacote (D-03). Só recompila quando o script muda.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-min
          key: ffmpeg-min-${{ hashFiles('scripts/ffmpeg-min.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm
          bash scripts/ffmpeg-min.sh ffmpeg-min
      - run: ls -l ffmpeg-min
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-min
          path: ffmpeg-min

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Spikes são experimentos da Fase 0 (o de vídeo depende de FFmpeg em .deps/); ficam fora da CI.
      - run: cargo clippy --workspace --exclude spike-video --exclude spike-p2p --all-targets -- -D warnings
      - run: cargo test --workspace --exclude spike-video --exclude spike-p2p
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-min
          path: ffmpeg-min
      - name: DLLs do FFmpeg carregam e têm os decoders
        shell: pwsh
        run: |
          $env:PATH = "$PWD\ffmpeg-min;$env:PATH"
          cargo test -p lerri-media --lib dlls_tem_os_tres_decoders -- --ignored
      - run: cargo build --release -p lerrichat
      - name: Tamanho do binário (RNF-02)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/lerrichat.exe).Length
          "lerrichat.exe: {0:N1} MB" -f ($size / 1MB)
          if ($size -gt $env:MAX_EXE_BYTES) { throw "lerrichat.exe passou de 25 MB" }
      - name: Sala e convite ponta a ponta
        shell: pwsh
        run: |
          $exe = "target/release/lerrichat.exe"
          $t = $env:RUNNER_TEMP
          $relay = Start-Process $exe -ArgumentList "--host","--port","47990","--data-dir","$t/relay" -RedirectStandardOutput relay.out -RedirectStandardError relay.err -PassThru
          for ($i = 0; $i -lt 100 -and -not (Select-String -Path relay.out -Pattern '^lerrichat://admin' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 200 }
          $admin = (Select-String -Path relay.out -Pattern '^lerrichat://admin.*').Matches[0].Value
          if (-not $admin) { Get-Content relay.out, relay.err; throw "relay não subiu" }
          try {
            $owner = "sair" | & $exe --data-dir "$t/owner" --create $admin
            if ($LASTEXITCODE -ne 0) { $owner; throw "criar sala falhou" }
            $invite = ($owner | Select-String -Pattern '^lerrichat://join.*').Matches[0].Value
            $guest = "sair" | & $exe --data-dir "$t/guest" --cli --join $invite
            if ($LASTEXITCODE -ne 0) { $guest; throw "entrar pelo convite falhou" }
            $again = "sair" | & $exe --data-dir "$t/intruder" --cli --join $invite 2>&1
            if ($LASTEXITCODE -eq 0 -or -not ($again -match 'foi usado')) { $again; throw "convite reutilizado foi aceito" }
          } finally {
            Stop-Process $relay.Id
          }
          # A recusa esperada deixou LASTEXITCODE=1, que o Actions trataria como falha.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: lerrichat-windows
          path: target/release/lerrichat.exe

  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Só o que o relay usa: sem ui/media (SPEC-01 §2).
      - run: cargo clippy -p lerri-core -p lerri-crypto -p lerri-net -p lerri-host -p lerrichat-host --all-targets -- -D warnings
      - run: cargo test -p lerri-core -p lerri-crypto -p lerri-net -p lerri-host
      - run: cargo build --release -p lerrichat-host
      - run: ls -lh target/release/lerrichat-host
      - uses: actions/upload-artifact@v4
        with:
          name: lerrichat-host-linux
          path: target/release/lerrichat-host

  # O .zip que se manda para os amigos; numa tag v* vira Release.
  pacote:
    needs: [windows, linux-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Montar o zip
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || v=$(git rev-parse --short HEAD)
          mkdir -p LerriChat/ffmpeg
          cp art/lerrichat-windows/lerrichat.exe pacote/LEIA-ME.txt LerriChat/
          cp art/ffmpeg-min/*.dll art/ffmpeg-min/LICENCA-FFmpeg.txt LerriChat/ffmpeg/
          zip -r -9 "LerriChat-$v-windows-x64.zip" LerriChat
          install -m 755 art/lerrichat-host-linux/lerrichat-host "lerrichat-host-$v-linux-x64"
          ls -l LerriChat-*.zip lerrichat-host-*
          echo "V=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: LerriChat-${{ env.V }}-windows-x64
          path: LerriChat
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LerriChat-*.zip
            lerrichat-host-*-linux-x64
