[package]
name = "lerrichat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
lerri-client = { version = "0.0.1", path = "../crates/client" }
lerri-core = { version = "0.0.1", path = "../crates/core" }
lerri-crypto = { version = "0.0.1", path = "../crates/crypto" }
lerri-host = { version = "0.0.1", path = "../crates/host" }
lerri-net = { version = "0.0.1", path = "../crates/net" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
