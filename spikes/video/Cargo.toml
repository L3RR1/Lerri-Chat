[package]
name = "spike-video"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat"] }
pollster = "1.0.1"
raw-window-handle = "0.6"
slint = { version = "1.18.1", features = ["unstable-wgpu-30", "renderer-femtovg-wgpu", "raw-window-handle-06"] }
wgpu = "30"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Direct3D12", "Win32_Security", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
