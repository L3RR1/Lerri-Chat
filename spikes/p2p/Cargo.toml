[package]
name = "spike-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
iroh = "1.3.0"
iroh-relay = { version = "1.3.0", features = ["server"] }
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
