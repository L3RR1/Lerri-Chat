[package]
name = "lerri-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
lerri-core = { version = "0.0.4", path = "../core" }
openmls = "0.9.1"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
