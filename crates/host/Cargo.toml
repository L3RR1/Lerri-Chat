[package]
name = "lerri-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1"
iroh-relay = { version = "1.3.0", default-features = false, features = ["server", "tls-ring"] }
lerri-core = { version = "0.0.3", path = "../core" }
lerri-crypto = { version = "0.0.3", path = "../crypto" }
lerri-net = { version = "0.0.3", path = "../net" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
lerri-client = { path = "../client" }
lerri-media = { path = "../media" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
