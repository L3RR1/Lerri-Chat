[package]
name = "lerri-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
lerri-core = { version = "0.0.1", path = "../core" }
lerri-crypto = { version = "0.0.1", path = "../crypto" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
sha2 = "0.11.0"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1.44"
zeroize = "1.9.1"
