[package]
name = "lerri-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
iroh = { version = "1.3.0", default-features = false, features = ["portmapper", "tls-ring"] }
iroh-relay = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
lerri-core = { version = "0.0.4", path = "../core" }
lerri-crypto = { version = "0.0.4", path = "../crypto" }
n0-error = "1.0.1"
n0-future = "0.3.2"
netdev = "0.45"
noq-proto = { version = "1.3.0", default-features = false }
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1.44"
zeroize = "1.9.1"
