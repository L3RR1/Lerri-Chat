[package]
name = "lerri-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
lerri-core = { version = "0.0.1", path = "../core" }
lerri-crypto = { version = "0.0.1", path = "../crypto" }
lerri-media = { version = "0.0.1", path = "../media" }
lerri-net = { version = "0.0.1", path = "../net" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1.44"
