[package]
name = "lerrichat-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
lerri-core = { version = "0.0.8", path = "../crates/core" }
lerri-host = { version = "0.0.8", path = "../crates/host" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
